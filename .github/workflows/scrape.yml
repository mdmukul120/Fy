name: Premium Deep-Dive Sports Scraper

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিট পর পর
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # cache অপশন মুছে ফেলা হয়েছে, তাই আর requirements.txt এরর আসবে না

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4 pydantic

    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run Premium Scraper
      run: python scraper.py

    - name: Commit and Push to GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "Premium Scraper Bot"
        git add premium_api.json
        
        # যদি ডেটা পরিবর্তন হয়, তবেই কমিট করবে
        git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Auto-updated deep-dive sports match data" && git push)
